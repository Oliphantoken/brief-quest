services:
  db:
    image: postgres:18
    container_name: briefquest-db
    environment:
      POSTGRES_USER: briefquest
      POSTGRES_PASSWORD: thebriefquest
      POSTGRES_DB: briefquest
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - briefquest_data:/var/lib/postgresql

volumes:
  briefquest_data: