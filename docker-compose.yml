services:
  api:
    build: /api
    container_name: briefquest-api
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ConnectionStrings__BriefQuest: "Host=db;Port=5432;Database=briefquest;Username=briefquest;Password=thebriefquest"
  db:
    image: postgres:18
    container_name: briefquest-db
    environment:
      POSTGRES_USER: briefquest
      POSTGRES_PASSWORD: thebriefquest
      POSTGRES_DB: briefquest
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - briefquest_data:/var/lib/postgresql

volumes:
  briefquest_data: